
services:
  postgres:
    image: postgres:15-alpine
    container_name: inventory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: server_inventory
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - inventory-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d server_inventory"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: inventory-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://inventory_user:${DB_PASSWORD:-changeme123}@postgres:5432/server_inventory
      SECRET_KEY: ${SECRET_KEY:-supersecretkey_change_in_production}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - inventory-net
    volumes:
      - export_data:/app/exports

  frontend:
    build: ./frontend
    container_name: inventory-ui
    restart: unless-stopped
    networks:
      - inventory-net
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: inventory-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    networks:
      - inventory-net
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  export_data:

networks:
  inventory-net:
    driver: bridge
